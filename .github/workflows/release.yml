name: Release artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EasyToDoList.sln --runtime win-x64 -p:SelfContained=true

      - name: Build
        run: dotnet build EasyToDoList.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test EasyToDoList.sln --configuration Release --no-build

      - name: Package Windows x64
        shell: pwsh
        run: |
          $packageArguments = @{ NoRestore = $true }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $packageArguments.Version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          ./scripts/package-release.ps1 @packageArguments

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: EasyToDoList-win-x64-${{ github.run_number }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
